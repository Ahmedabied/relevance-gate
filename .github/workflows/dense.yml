# Makes the dense runs in examples/dense with an open embedding model, on GitHub's machine.
# Runs only when examples/dense or this file changes. The runs it makes are uploaded as an artifact;
# when the committed runs exist, it scores both and fails if they do not give the same numbers.
name: dense

on:
  push:
    branches: [main]
    paths: ["examples/dense/**", ".github/workflows/dense.yml"]
  pull_request:
    paths: ["examples/dense/**", ".github/workflows/dense.yml"]

permissions:
  contents: read

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/relevance-gate
          key: beir-scifact-nfcorpus-536e1444-efe5be03
      - name: Install (CPU-only torch, pinned)
        run: |
          python -m pip install -e '.[test]'
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentence-transformers==6.2.0 transformers==5.22.2 numpy==2.5.4
      - name: Test embed.py with a fake encoder
        run: pytest -q examples/dense
      - name: Embed SciFact and NFCorpus
        run: |
          mkdir -p out
          for ds in scifact nfcorpus; do
            data=$(relevance-gate fetch "$ds")
            python examples/dense/embed.py --data "$data" -o "out/$ds.run.gz" --meta "out/$ds.json" \
              --doc-cache "$RUNNER_TEMP/$ds-docs.npy"
          done
      - name: Queries held out for tuning (SciFact train, NFCorpus dev), documents from the cache
        run: |
          data="$HOME/.cache/relevance-gate"
          python examples/dense/embed.py --data "$data/scifact" --split train -o out/scifact-train.run.gz \
            --meta out/scifact-train.json --doc-cache "$RUNNER_TEMP/scifact-docs.npy"
          python examples/dense/embed.py --data "$data/nfcorpus" --split dev -o out/nfcorpus-dev.run.gz \
            --meta out/nfcorpus-dev.json --doc-cache "$RUNNER_TEMP/nfcorpus-docs.npy"
      - name: Score BM25, dense and hybrid
        run: |
          for ds in scifact nfcorpus; do
            data="$HOME/.cache/relevance-gate/$ds"
            relevance-gate eval --data "$data" -o "out/$ds-bm25.json"
            relevance-gate eval --data "$data" --engine run --run "out/$ds.run.gz" -o "out/$ds-dense.json"
            relevance-gate eval --data "$data" --fuse "out/$ds.run.gz" -o "out/$ds-hybrid.json"
          done
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          print("| dataset | engine | nDCG@10 | recall@100 |\n|---|---|---|---|")
          for ds in ("scifact", "nfcorpus"):
              for e in ("bm25", "dense", "hybrid"):
                  m = json.load(open(f"out/{ds}-{e}.json"))["metrics"]
                  print(f"| {ds} | {e} | {m['ndcg@10']:.4f} | {m['recall@100']:.4f} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dense-runs
          path: out/
      - name: Same numbers as the committed runs
        run: |
          data="$HOME/.cache/relevance-gate"
          for ds in scifact nfcorpus; do
            python examples/dense/same.py --data "$data/$ds" "examples/dense/$ds.run.gz" "out/$ds.run.gz"
          done
          for held in scifact:train nfcorpus:dev; do
            ds=${held%%:*} split=${held##*:}
            if [ -f "examples/dense/$ds-$split.run.gz" ]; then
              python examples/dense/same.py --data "$data/$ds" --split "$split" \
                "examples/dense/$ds-$split.run.gz" "out/$ds-$split.run.gz"
            fi
          done
