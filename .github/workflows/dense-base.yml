# Is a bigger embedding model worth it? Makes a SciFact run with bge-base-en-v1.5 (110M parameters, about
# 3 times the compute of bge-small) on GitHub's machine. Runs only when examples/dense-base or this file
# changes; fails if a fresh run does not give the committed run's numbers.
name: dense-base

on:
  push:
    branches: [main]
    paths: ["examples/dense-base/**", ".github/workflows/dense-base.yml"]
  pull_request:
    paths: ["examples/dense-base/**", ".github/workflows/dense-base.yml"]

permissions:
  contents: read

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/relevance-gate
          key: beir-scifact-536e1444
      - name: Install (CPU-only torch, pinned)
        run: |
          python -m pip install -e '.[test]'
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentence-transformers==6.2.0 transformers==5.22.2 numpy==2.5.4
      - name: Embed SciFact with bge-base-en-v1.5
        run: |
          mkdir -p out
          data=$(relevance-gate fetch scifact)
          python examples/dense/embed.py --data "$data" --model BAAI/bge-base-en-v1.5 \
            --revision a5beb1e3e68b9ab74eb54cfd186867f64f240e1a -o out/scifact.run.gz --meta out/scifact.json
      - name: Score dense and hybrid, base and small
        run: |
          data="$HOME/.cache/relevance-gate/scifact"
          relevance-gate eval --data "$data" --engine run --run out/scifact.run.gz -o out/dense-base.json
          relevance-gate eval --data "$data" --fuse out/scifact.run.gz -o out/hybrid-base.json
          relevance-gate eval --data "$data" --fuse examples/dense/scifact.run.gz -o out/hybrid-small.json
      - uses: actions/upload-artifact@v4
        with:
          name: dense-base-runs
          path: out/
      - name: Same numbers as the committed run
        run: |
          if [ -f examples/dense-base/scifact.run.gz ]; then
            python examples/dense/same.py --data "$HOME/.cache/relevance-gate/scifact" \
              examples/dense-base/scifact.run.gz out/scifact.run.gz
          fi
