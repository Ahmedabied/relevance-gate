[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relevance-gate"
version = "0.1.0"
description = "Search evals that block regressions in CI: judged queries, nDCG, precision, zero-result rate, and a gate that fails the pull request when search gets worse."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ahmed Abied" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["search", "relevance", "evaluation", "ndcg", "information-retrieval", "ci", "sqlite", "fts5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
relevance-gate = "relevance_gate.cli:main"

[project.urls]
Homepage = "https://github.com/Ahmedabied/relevance-gate"

[tool.hatch.build.targets.wheel]
packages = ["src/relevance_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
